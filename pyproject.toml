[project]
name = "github-repo-manager"
version = "1.1.0"
description = "Streamlit app to discover, clone, and update repositories from a GitHub user or organization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[project.scripts]
github-repo-manager = "github_repo_manager.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_repo_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
